# Router Worker — ver `README.md` neste diretorio.
name = "o-inclusionista-router"
main = "src/index.js"
compatibility_date = "2024-11-15"

# As rotas que este Worker intercepta no zone `jrocha.dev.br`. Tudo o que nao casa com estes padroes passa
# para o projeto Pages do site, inalterado — o Worker nem sequer corre.

[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-platformer/*"
zone_name = "jrocha.dev.br"

[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-2048/*"
zone_name = "jrocha.dev.br"

# ⚠️ UMA SEGUNDA ROTA POR JOGO, PARA O CAMINHO NU. `/<slug>/*` NAO casa com `/<slug>` — medido em
# 04/10 no dominio a serio: `/game-2048` dava 404 e `/game-2048/` dava 200, num jogo ja roteado. Sem
# estas, o Worker nem sequer corre no endereco que uma pessoa escreve a mao, e por isso nem o
# redirecionamento que ele agora faz chegaria a acontecer.
[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-platformer"
zone_name = "jrocha.dev.br"

[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-2048"
zone_name = "jrocha.dev.br"

[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-chess"
zone_name = "jrocha.dev.br"

[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/heavy/*"
zone_name = "jrocha.dev.br"

# ⚠️ UMA ROTA POR JOGO. Para acrescentar `game-chess`, descomenta-se a linha aqui E a entrada em `GAMES`
# dentro de `src/index.js`. Nao e' preciso tocar em nenhum repo de jogo nem no do site.
#
# 📌 O `/heavy/*` NAO GANHA UMA ROTA POR JOGO — e' uma so, partilhada, e aponta sempre para o projeto Pages
# que tem a Pages Function com o binding R2 (hoje o `game-platformer`). O `game-2048` traz uma Function
# igual no seu repo por paridade, mas ela fica dormente: este router nunca lhe manda `/heavy/*`.
#
[[routes]]
pattern = "o-inclusionista.jrocha.dev.br/game-chess/*"
zone_name = "jrocha.dev.br"
