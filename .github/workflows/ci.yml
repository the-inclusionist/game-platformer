# SPDX-License-Identifier: AGPL-3.0-or-later
#
# THE CALLER — and it is short on purpose (ADR-0068 §4).
#
# The gate itself lives once, in the engine repository, and every game invokes it. Copying it here would
# create the failure that record refuses: three hundred copies drift, and the ones that drift silently are
# the ones that stop gating.
#
# ========================= WHY THIS FILE ARRIVED LAST, AND WHAT IT COST =========================
# 📏 MEASURED on 2026-09-08: of the six games in the local catalogue, four called this workflow and two did
# not — and the two were the ones that matter most. This one is the MONOLITH OF ORIGIN, the largest consumer
# of the engine, and the repository that has to migrate in lockstep with the 8.0 major. It was going to
# receive the biggest change of that major with no automatic verification of any kind.
#
# ⚠️ AND IT COULD NOT BE ADDED EARLIER, for a reason that was a SETTING and not code: the engine repository
# is private and its `actions/permissions/access` was `none`, so no other repository in the organisation
# could resolve `uses: the-inclusionist/…/game-ci.yml@main`. The four callers that already existed were ALL
# RED, each with ZERO jobs — which is why none of them had a log to read. Adding a fifth caller before that
# changed would have produced a fifth red pipeline that said nothing. The setting was changed to
# `organization` on 2026-09-08; this file is what that unblocked.
#
# ========================= WHAT WAS MEASURED BEFORE COMMITTING IT =========================
# The four steps `game-ci.yml` runs, run here first, and read by EXIT CODE rather than by the summary — a
# vitest run can print `N passed` and still exit non-zero on unhandled errors:
#
#   · `npm audit --omit=dev --audit-level=high` → 0
#   · `npm run typecheck`                       → 0
#   · `npx vitest run`                          → 0 · 41 files / 738 tests · zero unhandled
#   · `npm run build`                           → 0
#
# ⚠️ ONE STEP WAS NOT REPRODUCED LOCALLY: `npm ci`. It rewrites `node_modules` in a working tree that is not
# the one this was measured from, and this project has already paid for touching a consumer's dependencies.
# CI runs it, and it is the step where a lockfile problem would appear.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: the-inclusionist/the-inclusionist-engine/.github/workflows/game-ci.yml@main
    with:
      # ⚠️ TRUE, AND THIS LINE WAS `false` FOR EXACTLY ONE COMMIT. It went in saying that this repository —
      # the largest consumer of an accessibility-first engine — had no axe at all, while `game-soccer` did,
      # and naming what would close the gap: an axe script, WATCHED PASSING and PROVED ABLE TO FAIL, in that
      # order. That is what happened, and turning the flag on in its own commit is the point: a gate that has
      # never run is how a red gate reaches `main`.
      #
      # WHAT WAS DONE BEFORE THIS LINE CHANGED, in this order:
      #
      #   1. `npm run build`, then the exact sequence `game-ci.yml` runs — the built game served over HTTP,
      #      then `npm run test:a11y` against it. Printed `✓ axe: 0 WCAG A/AA violations`.
      #   2. PROVED IT CAN FAIL, which is the half that makes the green mean anything. Stripping `lang` from
      #      `<html>` in the served build returned `✗ axe: 1 WCAG A/AA violation(s)` — `html-has-lang` — and
      #      exit 1; a rebuild restored it and the gate went green again.
      #
      # 📌 `lang` and not an emptied button, and `game-soccer` recorded why after trying the other one first:
      # this game fills its text from the dictionary at boot, so emptied markup is REPAIRED before axe ever
      # sees it and the mutation stays green. A defect the runtime cannot repair is the one that proves the
      # gate looks at anything.
      a11y: true

      # This game's own records (ADR-0226, ADR-0242), validated with their citations resolved against the engine's.
      # Run locally before this line changed, with the command the step runs: 9 records · 9 sound · 0 with problems.
      adr-records: true

      # ⚠️ INHERITED, AND THE CHOICE IS MEASURED — `game-soccer` PINS this and the difference is real, so the
      # two cases must be told apart rather than copied. It pins because it has a floor of its OWN:
      # `scripts/build-sw.mjs` imports precache rules from TypeScript source and needs Node 24's native type
      # stripping. This repository has no such floor — no `build-sw.mjs`, no PWA plugin in `vite.config.ts`,
      # and its two build scripts (`atlas.mjs`, `vite-plugin-atlas.mjs`) are plain ESM.
      #
      # 📌 Pinning without a floor is the drift ADR-0068 §4 refuses, one line at a time: a number repeated in
      # six repositories that nobody remembers to move. `.node-version` here reads 24.14.0, the same as the
      # engine's default at the time of writing; when the engine moves, this game moves with it, which is the
      # point of a shared default.
    secrets:
      # Read access to the private engine repository, where the records this game cites live. A fine-grained token per
      # repository, because the organisation's plan has no organisation secrets for private repositories.
      records-token: ${{ secrets.RECORDS_TOKEN }}
