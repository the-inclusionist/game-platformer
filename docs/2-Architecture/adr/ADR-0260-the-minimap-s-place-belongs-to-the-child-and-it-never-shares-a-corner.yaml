title: The minimap's place on screen belongs to the CHILD — R2 moves it, her feet push it, and it never shares a corner with a button

context-and-problem-statement: |
  The minimap is drawn in the canvas, in the logical world of 320×180, pinned to the bottom-left corner. It had
  been there since it was born, and nothing could move it.

  THREE THINGS WENT WRONG WITH ONE FIXED CORNER, and the Dev reported them on the same day:

    · ⚠️ IT COVERS THE GROUND SHE IS WALKING ON. In a platformer the child walks under the map, and the map
      hides exactly the tiles her feet are about to land on. A map that hides the floor is worse than no map.
    · ⚠️ WITH A TOUCH PAD ON SCREEN THE BOTTOM-LEFT CORNER IS THE DIRECTIONAL. 📏 Measured at 1000×620: the map
      sat at (4, 140), entirely under the d-pad, invisible.
    · ⚠️ AND SHE HAS NO SAY. Whatever corner we pick is wrong for some level, some scenario, some child.

  🔴 AND THE TOP-RIGHT CORNER IS SHARED ACROSS A LINE NO `z-index` CROSSES. The minimap is drawn INSIDE the
  canvas; the pad's shoulder buttons and the HUD's carried-item icons are DOM on top of it. They are not in the
  same stacking context, so nothing arbitrates between them — whatever lands in the same place is simply
  hidden. ADR-0020 says the canvas and the DOM are two orders; this is the first time two things claimed one
  corner across that boundary.

decision-drivers:
  - "A map that hides the floor the child is standing on costs more than it gives."
  - "No fixed corner is right for every level, every scenario and every control method — so the choice has to
     be hers."
  - "A map drawn where a button is drawn is not a layering problem, because the two are in different orders.
     It is an arrangement problem, and it has to be measured rather than declared."
  - "ADR-0074 §1: the button that moves it has to be NAMED, or it is a feature for whoever already knows."

considered-options:
  - "M1 — leave the map where it is, and accept that it covers the floor and hides under the d-pad"
  - "M2 — move it automatically: flee the character, and jump to a free corner when a pad appears"
  - "M3 — give the child a button (R2) that cycles the corners, and let the map flee her feet"
  - "M4 — M3, and in the top-right the map drops BELOW the shoulder column"
  - "M5 — M3, and in the top-right the map sits BESIDE the shoulder column, with the carried items below it"

pros-and-cons-of-the-options:
  M1:
